<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Draw It</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Baloo+2:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/claymorphism.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">
    <!-- Confetti Container -->
    <canvas id="confetti" class="confetti-canvas"></canvas>

    <!-- Background Decorations -->
    <div class="bg-decorations">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="balloon balloon-1">🎈</div>
        <div class="balloon balloon-2">🎈</div>
        <div class="star star-1">⭐</div>
        <div class="star star-2">✨</div>
    </div>

    <div class="container">
        <div class="auth-container">
            <div class="auth-card clay-card">
                <div class="auth-header">
                    <h1>🎨 Join Draw It</h1>
                    <p>Create your account and start drawing!</p>
                </div>

                <form id="signupForm" class="auth-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Choose a cool username" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="your@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Create a strong password" required>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Type password again" required>
                    </div>

                    <div class="form-group">
                        <label>Choose Your Avatar</label>
                        <div class="avatar-selector">
                            <div class="avatar-option" data-avatar="boy">
                                <div class="avatar-circle">👦</div>
                                <span>Boy</span>
                            </div>
                            <div class="avatar-option" data-avatar="girl">
                                <div class="avatar-circle">👧</div>
                                <span>Girl</span>
                            </div>
                            <div class="avatar-option" data-avatar="cat">
                                <div class="avatar-circle">🐱</div>
                                <span>Cat</span>
                            </div>
                            <div class="avatar-option" data-avatar="rabbit">
                                <div class="avatar-circle">🐰</div>
                                <span>Rabbit</span>
                            </div>
                            <div class="avatar-option" data-avatar="fox">
                                <div class="avatar-circle">🦊</div>
                                <span>Fox</span>
                            </div>
                            <div class="avatar-option" data-avatar="panda">
                                <div class="avatar-circle">🐼</div>
                                <span>Panda</span>
                            </div>
                        </div>
                        <input type="hidden" id="selectedAvatar" name="avatar" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">
                        Create Account 🚀
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Already have an account? <a href="login.html">Login here</a></p>
                    <p><a href="index.html">← Back to Home</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize signup page functionality
        document.addEventListener('DOMContentLoaded', () => {
            const signupForm = document.getElementById('signupForm');
            const avatarOptions = document.querySelectorAll('.avatar-option');
            const selectedAvatarInput = document.getElementById('selectedAvatar');
            
            // Avatar selection
            avatarOptions.forEach(option => {
                option.addEventListener('click', function() {
                    avatarOptions.forEach(opt => opt.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedAvatarInput.value = this.dataset.avatar;
                });
            });
            
            // Form submission
            signupForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                const avatar = selectedAvatarInput.value;
                
                // Validation
                if (!username) {
                    alert('Please enter a username');
                    return;
                }
                
                if (!email || !email.includes('@')) {
                    alert('Please enter a valid email');
                    return;
                }
                
                if (password.length < 6) {
                    alert('Password must be at least 6 characters');
                    return;
                }
                
                if (password !== confirmPassword) {
                    alert('Passwords do not match');
                    return;
                }
                
                if (!avatar) {
                    alert('Please select an avatar');
                    return;
                }
                
                // Get existing users
                const users = JSON.parse(localStorage.getItem('drawit_users') || '[]');
                
                // Check if email exists
                if (users.some(u => u.email === email)) {
                    alert('Email already registered');
                    return;
                }
                
                // Create new user
                const newUser = {
                    id: Date.now().toString(),
                    username: username,
                    email: email,
                    password: password,
                    avatar: avatar,
                    joinedDate: new Date().toISOString(),
                    favoriteColor: '#FF70A6',
                    totalDrawings: 0
                };
                
                users.push(newUser);
                localStorage.setItem('drawit_users', JSON.stringify(users));
                localStorage.setItem('drawit_currentUser', email);
                
                // Show confetti
                const canvas = document.getElementById('confetti');
                if (canvas) {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    const ctx = canvas.getContext('2d');
                    const pieces = [];
                    const colors = ['#FF70A6', '#70D6FF', '#FFD670', '#7AE582', '#A685FF'];
                    
                    for (let i = 0; i < 200; i++) {
                        pieces.push({
                            x: Math.random() * canvas.width,
                            y: Math.random() * canvas.height - canvas.height,
                            rotation: Math.random() * 360,
                            speed: Math.random() * 3 + 2,
                            size: Math.random() * 10 + 5,
                            color: colors[Math.floor(Math.random() * colors.length)]
                        });
                    }
                    
                    function animate() {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        pieces.forEach((piece, index) => {
                            piece.y += piece.speed;
                            piece.rotation += 2;
                            if (piece.y > canvas.height) {
                                pieces.splice(index, 1);
                            }
                            ctx.save();
                            ctx.translate(piece.x, piece.y);
                            ctx.rotate(piece.rotation * Math.PI / 180);
                            ctx.fillStyle = piece.color;
                            ctx.fillRect(-piece.size / 2, -piece.size / 2, piece.size, piece.size);
                            ctx.restore();
                        });
                        if (pieces.length > 0) {
                            requestAnimationFrame(animate);
                        }
                    }
                    animate();
                }
                
                alert('Account created successfully! 🎉');
                
                // Redirect to home
                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 1500);
            });
        });
    </script>
</body>
</html>
