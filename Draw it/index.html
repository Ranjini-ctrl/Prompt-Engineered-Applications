<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draw It - Creative Drawing for Kids</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Baloo+2:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/claymorphism.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="landing-page">
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-content">
            <div class="pencil-draw">
                <svg class="pencil" width="100" height="100" viewBox="0 0 100 100">
                    <path d="M20 80 L50 20 L80 80" stroke="#FF70A6" stroke-width="4" fill="none" class="draw-path"/>
                </svg>
            </div>
            <h1 class="loading-text">Draw It</h1>
        </div>
    </div>

    <!-- Animated Background Elements -->
    <div class="bg-decorations">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
        
        <div class="bird bird-1">🐦</div>
        <div class="bird bird-2">🦋</div>
        
        <div class="balloon balloon-1">🎈</div>
        <div class="balloon balloon-2">🎈</div>
        
        <div class="star star-1">⭐</div>
        <div class="star star-2">✨</div>
        <div class="star star-3">⭐</div>
        
        <div class="sun">☀️</div>
        
        <div class="rainbow"></div>
        
        <div class="floating-crayon crayon-1">🖍️</div>
        <div class="floating-crayon crayon-2">✏️</div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="landing-content">
            <!-- Logo -->
            <div class="logo-container">
                <div class="logo-pencil">✏️</div>
                <h1 class="main-logo">Draw It</h1>
                <div class="logo-brush">🎨</div>
            </div>

            <!-- Tagline -->
            <p class="tagline">
                <span class="tagline-word">Imagine</span>
                <span class="dot">•</span>
                <span class="tagline-word">Draw</span>
                <span class="dot">•</span>
                <span class="tagline-word">Color</span>
                <span class="dot">•</span>
                <span class="tagline-word">Create</span>
            </p>

            <!-- Buttons -->
            <div class="button-group">
                <a href="signup.html" class="btn btn-primary">
                    <span>🎨 Sign Up</span>
                </a>
                <a href="login.html" class="btn btn-secondary">
                    <span>🖍️ Login</span>
                </a>
            </div>

            <!-- Features Preview -->
            <div class="features-preview">
                <div class="feature-icon">✏️</div>
                <div class="feature-icon">🎨</div>
                <div class="feature-icon">🖼️</div>
                <div class="feature-icon">🌈</div>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script>
        // Hide loading screen after page loads
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loadingScreen = document.getElementById('loadingScreen');
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                }, 500);
            }, 1500);
        });

        // Play sound on button click (optional)
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                playSound('click');
            });
        });
    </script>
</body>
</html>
